org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
android.newDsl=false
# Built-in Kotlin (AGP 9+): enabled after removing the last KGP-applying
# plugin (workmanager was replaced by a native scheduler). If a future
# third-party plugin re-introduces legacy `kotlin-android` applies, Flutter
# will warn during build — upgrade or replace that plugin instead of turning
# this flag back off.
# Built-in Kotlin is BLOCKED upstream: audioplayers_android 5.3.0 (latest)
# still applies org.jetbrains.kotlin.android, which fails under AGP9 built-in
# Kotlin. Revisit when audioplayers ships a built-in-Kotlin-compatible
# release; sentry_flutter/wakelock_plus pins in pubspec.yaml depend on this.
android.builtInKotlin=false
org.gradle.caching=true
org.gradle.parallel=true
android.enableJetifier=true
android.suppressUnsupportedCompressionSdk=true
android.suppressUnsupportedAbis=true
# org.gradle.java.home is deliberately NOT set here: an absolute JDK path is
# machine-specific and breaks builds on other machines/CI. Put the override in
# the untracked user-level ~/.gradle/gradle.properties (developer machines) or
# let CI/Gradle resolve its own configured JDK.
flutter.compileSdkVersion=36
flutter.targetSdkVersion=36
flutter.minSdkVersion=24

# LEGACY: `buildChannel` used to select a fixed direct-channel versionCode when
# the build script branched on it; it is no longer read by any Gradle script.
# The versionCode is now the frozen constant in android/app/build.gradle.kts
# (see docs/versioning.md). Kept inert for older tooling that may still set it.
buildChannel=play

